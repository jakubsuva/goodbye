# Fallback: `brew install xcodegen && xcodegen` regenerates Goodbye.xcodeproj from this file.
name: Goodbye
options:
  bundleIdPrefix: com.jakubsuva
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  Goodbye:
    type: application
    platform: iOS
    sources: [Goodbye]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubsuva.goodbye
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goodbye
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
